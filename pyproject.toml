[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hyvpn"
version = "1.1.0"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["core*", "bot*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# UP017: `timezone.utc` reads better than `datetime.UTC` in this codebase.
ignore = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `pytest` (as opposed to `python -m pytest`) does not put the repo root on
# sys.path, and the tests import `core`, `bot` and `hy_core_app` from there.
pythonpath = ["."]
filterwarnings = ["error::DeprecationWarning"]
